name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: feature/task-68-data-rc-readiness
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "SQLAlchemy>=2.0,<3.0"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muscles
          POSTGRES_PASSWORD: muscles
          POSTGRES_DB: muscles_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muscles -d muscles_data"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles
          ref: main
          path: muscles
      - uses: actions/checkout@v4
        with:
          repository: butkoden/muscles-data
          ref: main
          path: muscles-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./muscles --no-deps
      - run: python -m pip install -e ./muscles-data --no-deps
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "SQLAlchemy>=2.0,<3.0" "psycopg[binary]>=3.1,<4.0"
      - run: python -m pytest -q -m integration
        env:
          MUSCLES_DATA_INTEGRATION: "1"
          SQLALCHEMY_POSTGRES_URL: postgresql+psycopg://muscles:muscles@127.0.0.1:5432/muscles_data
